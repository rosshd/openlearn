{% extends "base.html" %}
{% block content %}
<section class="review-shell" data-review-shell data-course="{{ request.query_params.get('course', '') }}" aria-labelledby="review-page-title">
  <header>
    <p class="eyebrow">Practice</p>
    <h1 id="review-page-title">Review what is due.</h1>
    <p class="quiet-copy" data-review-summary>{{ review.count }} remaining · 0 reviewed</p>
  </header>
  <article class="work-panel review-panel" data-review-panel aria-busy="false">
    <p>Loading your review cards…</p>
    <noscript>Enable JavaScript to reveal answers and save review ratings.</noscript>
  </article>
  <a class="quiet-link review-back" href="{{ url_for('dashboard') }}">Back to courses</a>
  <script type="application/json" data-review-snapshot>
    {"server_time": {{ review.get('server_time', '')|tojson }}, "items": [
    {% for item in review['items'] %}
      {"slug": {{ item.slug|tojson }}, "course": {{ item.course|tojson }}, "concept": {{ item.concept|tojson }}, "due": {{ item.due|tojson }},
       "card_id": {{ item.get('card_id', '')|tojson }}, "content_version": {{ item.get('content_version', 0)|tojson }},
       "review_revision": {{ item.get('review_revision', '')|tojson }}, "state": {{ item.get('state', 'needs_preparation')|tojson }},
       "question": {{ item.get('question', '')|tojson }}, "relearn_at": {{ item.get('relearn_at')|tojson }}}{% if not loop.last %},{% endif %}
    {% endfor %}]}
  </script>
</section>
{% endblock %}
