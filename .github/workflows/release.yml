name: Release

on:
  push:
    tags: ["v*"]

jobs:
  locate-candidate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Require the release commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Download the exact candidate from a successful full-gate run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list \
            --workflow tests.yml \
            --commit "$GITHUB_SHA" \
            --status success \
            --json databaseId,workflowName,headSha,conclusion \
            --jq '.[] | select(.workflowName == "Tests" and .headSha == env.GITHUB_SHA and .conclusion == "success") | .databaseId' \
            | head -n 1)
          test -n "$run_id"
          gh run download "$run_id" \
            --name "release-candidate-${GITHUB_SHA}" \
            --dir release-candidate
      - name: Enforce metadata, module, artifact, hash, CLI, and tag parity
        shell: bash
        run: |
          set -euo pipefail
          source_version=$(python -c 'import sys; sys.path.insert(0, "src"); import openlearn; print(openlearn.__version__)')
          python scripts/release_artifacts.py verify \
            --candidate release-candidate \
            --expected-version "$source_version" \
            --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-candidate-${{ github.sha }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 30

  promote:
    needs: locate-candidate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: verified-release-candidate-${{ github.sha }}
          path: release-candidate
      - name: Publish the verified distributions to PyPI without rebuilding
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-candidate/dist
      - name: Create the GitHub release from the same verified bytes and hashes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-candidate/dist/*
          release-candidate/SHA256SUMS
          --generate-notes
