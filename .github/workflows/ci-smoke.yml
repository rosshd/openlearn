name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tests-and-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest -v
      - name: Run native mocked CLI smoke
        shell: bash
        env:
          OPENLEARN_MOCK: "1"
          OPENLEARN_HOME: ${{ runner.temp }}/openlearn-smoke
        run: |
          openlearn test --reset --no-menu
          openlearn chat practical-vim-foundations "explain normal mode"
